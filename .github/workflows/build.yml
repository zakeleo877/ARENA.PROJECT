name: Build and verify

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package both apps
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/Android/Sdk
          key: android-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          # The command line tools are preinstalled on the runner images; move
          # them into the layout the sdkmanager expects.
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            echo "cmdline-tools already present"
          elif [ -d /usr/local/lib/android/sdk/cmdline-tools/latest ]; then
            cp -r /usr/local/lib/android/sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools-tmp"
            mv "$ANDROID_HOME/cmdline-tools-tmp/latest" "$ANDROID_HOME/cmdline-tools/latest"
          else
            echo "Downloading the Android command line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          set -uo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p /tmp/sdk-logs
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "--- sdkmanager version ---"
            sdkmanager --version 2>&1
            echo "--- licenses ---"
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses 2>&1 | tail -n 20
            echo "--- platforms ---"
            sdkmanager --sdk_root="$ANDROID_HOME" --list 2>&1 | grep -E 'platforms;android-3[0-9]' | head -n 15
            echo "--- build tools ---"
            sdkmanager --sdk_root="$ANDROID_HOME" --list 2>&1 | grep -E 'build-tools;3[0-9]' | head -n 15
          } | tee /tmp/sdk-logs/sdk-probe.txt

          PLATFORM="$(grep -oE 'platforms;android-3[0-9]' /tmp/sdk-logs/sdk-probe.txt | sort -u | tail -n 1)"
          BUILD_TOOLS="$(grep -oE 'build-tools;3[0-9][0-9.]*' /tmp/sdk-logs/sdk-probe.txt | sort -V | tail -n 1)"

          {
            echo "### Chosen platform: ${PLATFORM:-none found}"
            echo "### Chosen build tools: ${BUILD_TOOLS:-none found}"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '<details><summary>sdkmanager probe</summary>'
            echo
            echo '```'
            cat /tmp/sdk-logs/sdk-probe.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" \
            "${PLATFORM:-platforms;android-36}" \
            "${BUILD_TOOLS:-build-tools;36.0.0}" 2>&1 | tee /tmp/sdk-logs/sdk-install.txt || {
              {
                echo '<details><summary>sdkmanager install output</summary>'
                echo
                echo '```'
                cat /tmp/sdk-logs/sdk-install.txt
                echo '```'
                echo '</details>'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

          {
            echo "### Installed packages"
            echo '```'
            sdkmanager --sdk_root="$ANDROID_HOME" --list_installed 2>&1 | head -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The publishable key and the project URL are public values, but they are
      # kept in secrets so nothing sensitive is ever committed.
      - name: Generate local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties

      # The signing key is created in the runner only and never leaves it.
      - name: Generate debug keystore for packaging checks
        run: |
          keytool -genkeypair -v \
            -keystore keystore.properties \
            -storepass android \
            -keypass android \
            -alias saeed \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Saeed Stores, OU=Dev, O=Saeed, L=Algiers, C=DZ"
          cat > keystore.properties <<'EOF'
          storeFile=keystore.properties
          storePassword=android
          keyAlias=saeed
          keyPassword=android
          EOF

      - name: Run unit tests and lint
        env:
          SAEED_COMPILE_SDK: ${{ vars.SAEED_COMPILE_SDK }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test lint 2>&1 | tee /tmp/gradle-test.log || {
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong' -A 3 /tmp/gradle-test.log | head -n 120 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          {
            echo '### Gradle test and lint output'
            echo '```'
            tail -n 40 /tmp/gradle-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts/logs
          find . -name '*.xml' -path '*/test-results/*' -exec cp --parents {} artifacts/logs/ \; 2>/dev/null || true
          find . -name 'lint-results*.html' -exec cp --parents {} artifacts/logs/ \; 2>/dev/null || true

      - name: Build both release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :customer:assembleRelease :admin:assembleRelease 2>&1 | tee /tmp/gradle-build.log || {
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong' -A 3 /tmp/gradle-build.log | head -n 150 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          {
            echo '### Gradle build output'
            echo '```'
            tail -n 30 /tmp/gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts/apk
          cp customer/build/outputs/apk/release/*.apk artifacts/apk/saeed-store-1.0.apk
          cp admin/build/outputs/apk/release/*.apk artifacts/apk/saeed-admin-1.0.apk

      - name: Verify the packages (acceptance checks 1-10)
        run: |
          bash scripts/verify-apk.sh artifacts/apk/saeed-store-1.0.apk saeed-store
          bash scripts/verify-apk.sh artifacts/apk/saeed-admin-1.0.apk saeed-admin

      - name: Verify the repository (acceptance checks 11-13)
        run: bash scripts/verify-repo.sh

      - name: Run the local database smoke tests
        working-directory: supabase/tests
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Upload APKs and logs
        uses: actions/upload-artifact@v4
        with:
          name: saeed-stores-apks
          path: artifacts/
          if-no-files-found: error
