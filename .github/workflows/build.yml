name: Build and verify

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build, test and package both apps
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the runner Android SDK
        run: |
          set -uo pipefail
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            echo "--- /usr/local/lib/android/sdk ---"
            ls -la /usr/local/lib/android/sdk 2>&1 || true
            echo "--- /opt/android ---"
            ls -la /opt/android 2>&1 || true
            echo "--- $HOME/Android ---"
            ls -la "$HOME/Android" 2>&1 || true
            echo "--- sdkmanager binaries ---"
            find /usr /opt "$HOME" -name 'sdkmanager' -type f 2>/dev/null | head -n 20
            echo "--- java ---"
            java -version 2>&1 || true
          } > /tmp/runner-probe.txt 2>&1
          cat /tmp/runner-probe.txt

          SDKMANAGER_PATH=""
          for candidate in \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager \
            /opt/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "$HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER_PATH="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "--- downloading the command line tools ---"
            SDKMANAGER_PATH=""
          else
            # .../sdk/cmdline-tools/latest/bin/sdkmanager -> .../sdk
            SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER_PATH")")")")"
            echo "Using SDK root $SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          fi

          if [ -z "$SDKMANAGER_PATH" ]; then
            SDK_ROOT="$HOME/Android/Sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "SDKMANAGER=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install the platform
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true

          # The runner image ships a set of platforms. Prefer the one the
          # project targets, and fall back to the newest available so the
          # build still runs on images that lag behind.
          AVAILABLE="$("$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list 2>/dev/null || true)"
          {
            echo "--- installed platforms directory ---"
            ls "$ANDROID_HOME/platforms" 2>&1 || true
            echo "--- installed build-tools directory ---"
            ls "$ANDROID_HOME/build-tools" 2>&1 || true
            echo "--- sdkmanager --list (filtered) ---"
            echo "$AVAILABLE" | grep -E 'platforms;android-|build-tools;' | head -n 40 || true
          } >> /tmp/runner-probe.txt 2>&1

          PLATFORM="$(echo "$AVAILABLE" | grep -oE 'platforms;android-3[0-9][0-9.]*(-[a-z0-9]+)?' | sort -u | tail -n 1)"
          BUILD_TOOLS="$(echo "$AVAILABLE" | grep -oE 'build-tools;3[0-9][0-9.]*' | sort -V | tail -n 1)"
          echo "Selected platform: ${PLATFORM:-none}"
          echo "Selected build tools: ${BUILD_TOOLS:-none}"

          set +e
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" \
            "${PLATFORM:-platforms;android-35}" "${BUILD_TOOLS:-build-tools;35.0.0}" \
            > /tmp/sdk-install.txt 2>&1
          INSTALL_STATUS=$?
          set -e
          {
            echo "--- sdkmanager install output ---"
            cat /tmp/sdk-install.txt
            echo "install status: $INSTALL_STATUS"
          } >> /tmp/runner-probe.txt 2>&1

          # Tell Gradle which platform to compile against. The runner image
          # already ships platforms, so an install failure is not fatal as long
          # as a platform is present.
          INSTALLED_PLATFORM_ID="$(ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -oE 'android-[0-9]+(\.[0-9]+)?' | sed 's/android-//' | sort -V | tail -n 1)"
          if [ -n "$INSTALLED_PLATFORM_ID" ]; then
            echo "SAEED_COMPILE_SDK=$INSTALLED_PLATFORM_ID" >> "$GITHUB_ENV"
            echo "Compiling against the installed platform API $INSTALLED_PLATFORM_ID"
          elif [ "$INSTALL_STATUS" != "0" ]; then
            cat /tmp/runner-probe.txt
            exit 1
          fi

      # The publishable key and the project URL are public values, but they are
      # kept in secrets so nothing sensitive is ever committed.
      # Check that every pinned plugin and library version exists before the
      # build starts, so a bad version is reported clearly.
      - name: Verify the pinned versions
        run: |
          set -uo pipefail
          {
            echo "## Plugin and library versions"
            for url in \
              "https://plugins.gradle.org/m2/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/2.4.21/org.jetbrains.kotlin.plugin.compose.gradle.plugin-2.4.21.pom" \
              "https://plugins.gradle.org/m2/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/2.4.20/org.jetbrains.kotlin.plugin.compose.gradle.plugin-2.4.20.pom" \
              "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
              "https://repo1.maven.org/maven2/androidx/room3/room3-runtime/3.0.3/room3-runtime-3.0.3.pom" \
              "https://repo1.maven.org/maven2/com/google/dagger/hilt-android/2.60.1/hilt-android-2.60.1.pom" \
              "https://repo1.maven.org/maven2/androidx/compose/compose-bom/2026.09.00/compose-bom-2026.09.00.pom" \
              "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.5.0/gradle-9.5.0.pom"; do
              CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" 2>/dev/null || echo ERR)"
              echo "$CODE  $url"
            done
          } > /tmp/versions.txt 2>&1
          cat /tmp/versions.txt

      - name: Generate local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties

      # The signing key is created in the runner only and never leaves it.
      - name: Generate a signing keystore for the packaging checks
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass android -keypass android \
            -alias saeed -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Saeed Stores, OU=Dev, O=Saeed, L=Algiers, C=DZ"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=android
          keyAlias=saeed
          keyPassword=android
          EOF

      - name: Run unit tests and lint
        env:
          SAEED_COMPILE_SDK: ${{ vars.SAEED_COMPILE_SDK }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test lint 2>&1 | tee /tmp/gradle-test.log || {
            echo "### Gradle test and lint failure"
            echo '```'
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong|^\s+>' -A 3 /tmp/gradle-test.log | head -n 150
            echo '```'
            exit 1
          }

      - name: Build both release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :customer:assembleRelease :admin:assembleRelease 2>&1 | tee /tmp/gradle-build.log || {
            echo "### Gradle build failure"
            echo '```'
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong|^\s+>' -A 3 /tmp/gradle-build.log | head -n 180
            echo '```'
            exit 1
          }
          mkdir -p artifacts/apk
          cp customer/build/outputs/apk/release/*.apk artifacts/apk/saeed-store-1.0.apk
          cp admin/build/outputs/apk/release/*.apk artifacts/apk/saeed-admin-1.0.apk

      - name: Verify the packages (acceptance checks 1-10)
        run: |
          bash scripts/verify-apk.sh artifacts/apk/saeed-store-1.0.apk saeed-store
          bash scripts/verify-apk.sh artifacts/apk/saeed-admin-1.0.apk saeed-admin

      - name: Verify the repository (acceptance checks 11-13)
        run: bash scripts/verify-repo.sh

      - name: Run the local database smoke tests
        working-directory: supabase/tests
        run: |
          npm ci --no-audit --no-fund
          npm test


      # The failure output is published with the GitHub API so it can be read
      # even when the log and artifact storage hosts are unreachable.
      - name: Publish diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          {
            echo "# CI diagnostics"
            echo
            echo "Run: $RUN_ID"
            echo "Commit: $SHA"
            echo
            echo "## runner probe"
            echo '```'
            cat /tmp/runner-probe.txt 2>/dev/null || echo "(no probe output)"
            echo '```'
            echo
            echo '## version probe'
            echo '```'
            cat /tmp/versions.txt 2>/dev/null || echo "(not reached)"
            echo '```'
            echo
            echo '## Gradle test and lint'
            echo '```'
            head -n 60 /tmp/gradle-test.log 2>/dev/null || echo "(not reached)"
            echo
            echo '--- failure lines ---'
            grep -E 'FAILED|FAILURE|error:|^e: |Execution failed|> Task .* FAILED|tests? completed' /tmp/gradle-test.log 2>/dev/null | head -n 60 || echo "(none)"
            echo
            echo '--- tail ---'
            tail -n 60 /tmp/gradle-test.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Gradle build'
            echo '```'
            head -n 60 /tmp/gradle-build.log 2>/dev/null || echo "(not reached)"
            echo
            echo '--- failure lines ---'
            grep -E 'FAILED|FAILURE|error:|^e: |Execution failed|> Task .* FAILED' /tmp/gradle-build.log 2>/dev/null | head -n 60 || echo "(none)"
            echo
            echo '--- tail ---'
            tail -n 60 /tmp/gradle-build.log 2>/dev/null || true
            echo '```'
          } > diagnostics/latest.md

          # The payload is built with a JSON encoder so newlines and quotes in
          # the captured output are escaped correctly.
          python3 -c "import base64,json,os; d=open('diagnostics/latest.md','rb').read(); open('/tmp/diag-payload.json','w').write(json.dumps({'message':'CI diagnostics for run '+os.environ['RUN_ID'],'content':base64.b64encode(d).decode('ascii'),'branch':'ci-diagnostics'}))"

          # Point the diagnostics branch at the commit that was just built.
          curl -sS -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/refs/heads/ci-diagnostics" \
            -d "{\"sha\":\"$SHA\",\"force\":true}" > /dev/null

          curl -sS -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/diagnostics/latest.md?branch=ci-diagnostics" \
            --data-binary @/tmp/diag-payload.json \
            -o /tmp/diag-response.json -w 'HTTP %{http_code}\n'
          head -c 300 /tmp/diag-response.json
          echo

      - name: Upload APKs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saeed-stores-apks
          path: artifacts/
          if-no-files-found: warn
