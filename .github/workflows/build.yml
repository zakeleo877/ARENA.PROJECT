name: Build and verify

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package both apps
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the runner Android SDK
        run: |
          set -euo pipefail
          # The runner image already ships a complete Android SDK. Using it
          # avoids downloading anything and keeps the build fast.
          for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" "$RUNNER_TEMP/android-sdk"; do
            if [ -x "$candidate/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
              echo "SDKMANAGER=$candidate/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "No usable Android SDK was found on this runner." >&2
            ls -la /usr/local/lib/android/sdk 2>&1 || true
            exit 1
          fi
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept licenses and install the platform
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          # The project compiles against API 37; install the platform and the
          # matching build tools. The list is read from the repository so a
          # newer platform can be used without editing this file.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37" "build-tools;37.0.0"

      # The publishable key and the project URL are public values, but they are
      # kept in secrets so nothing sensitive is ever committed.
      - name: Generate local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties

      # The signing key is created in the runner only and never leaves it.
      - name: Generate a signing keystore for the packaging checks
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass android -keypass android \
            -alias saeed -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Saeed Stores, OU=Dev, O=Saeed, L=Algiers, C=DZ"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=android
          keyAlias=saeed
          keyPassword=android
          EOF

      - name: Run unit tests and lint
        env:
          SAEED_COMPILE_SDK: ${{ vars.SAEED_COMPILE_SDK }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test lint 2>&1 | tee /tmp/gradle-test.log || {
            echo "### Gradle test and lint failure"
            echo '```'
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong|^\s+>' -A 3 /tmp/gradle-test.log | head -n 150
            echo '```'
            exit 1
          }

      - name: Build both release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :customer:assembleRelease :admin:assembleRelease 2>&1 | tee /tmp/gradle-build.log || {
            echo "### Gradle build failure"
            echo '```'
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong|^\s+>' -A 3 /tmp/gradle-build.log | head -n 180
            echo '```'
            exit 1
          }
          mkdir -p artifacts/apk
          cp customer/build/outputs/apk/release/*.apk artifacts/apk/saeed-store-1.0.apk
          cp admin/build/outputs/apk/release/*.apk artifacts/apk/saeed-admin-1.0.apk

      - name: Verify the packages (acceptance checks 1-10)
        run: |
          bash scripts/verify-apk.sh artifacts/apk/saeed-store-1.0.apk saeed-store
          bash scripts/verify-apk.sh artifacts/apk/saeed-admin-1.0.apk saeed-admin

      - name: Verify the repository (acceptance checks 11-13)
        run: bash scripts/verify-repo.sh

      - name: Run the local database smoke tests
        working-directory: supabase/tests
        run: |
          npm ci --no-audit --no-fund
          npm test


      # The failure output is published with the GitHub API so it can be read
      # even when the log and artifact storage hosts are unreachable.
      - name: Publish diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          {
            echo "# CI diagnostics"
            echo
            echo "Run: $RUN_ID"
            echo "Commit: $SHA"
            echo
            echo '## Gradle test and lint'
            echo '```'
            tail -n 200 /tmp/gradle-test.log 2>/dev/null || echo "(not reached)"
            echo '```'
            echo
            echo '## Gradle build'
            echo '```'
            tail -n 200 /tmp/gradle-build.log 2>/dev/null || echo "(not reached)"
            echo '```'
          } > diagnostics/latest.md

          BODY="$(python3 -c 'import json,sys; print(json.dumps(open("diagnostics/latest.md").read())[:60000])')"

          # Create the branch if it does not exist yet.
          curl -sS -H "Authorization: token $GITHUB_TOKEN"             "https://api.github.com/repos/$REPO/git/refs/heads/ci-diagnostics" > /tmp/ref.json
          if grep -q '"ref"' /tmp/ref.json; then
            curl -sS -X PATCH -H "Authorization: token $GITHUB_TOKEN"               "https://api.github.com/repos/$REPO/git/refs/heads/ci-diagnostics"               -d "{\"sha\":\"$SHA\",\"force\":true}" > /dev/null
          else
            curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN"               "https://api.github.com/repos/$REPO/git/refs"               -d "{\"ref\":\"refs/heads/ci-diagnostics\",\"sha\":\"$SHA\"}" > /dev/null
          fi

          # Write the file on that branch.
          curl -sS -X PUT -H "Authorization: token $GITHUB_TOKEN"             "https://api.github.com/repos/$REPO/contents/diagnostics/latest.md?branch=ci-diagnostics"             -d "{\"message\":\"CI diagnostics for run $RUN_ID\",\"content\":$BODY,\"branch\":\"ci-diagnostics\"}"             | head -c 200
          echo

          # Also comment on the commit so the failure is visible in the UI.
          SUMMARY="$(grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong' -A 2 /tmp/gradle-test.log /tmp/gradle-build.log 2>/dev/null | head -n 60 || echo '(no Gradle output captured)')"
          COMMENT="$(python3 -c "import json,sys; print(json.dumps('CI diagnostics for this run:\n\n\`\`\`\n'+open('/tmp/comment-body.txt').read()+'\n\`\`\`'))" 2>/dev/null || echo '{}')"
          printf '%s' "$SUMMARY" > /tmp/comment-body.txt
          COMMENT="$(python3 -c "import json; print(json.dumps({'body': open('/tmp/comment-body.txt').read()[:60000]}))")"
          curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN"             "https://api.github.com/repos/$REPO/commits/$SHA/comments"             -d "$COMMENT" | head -c 200
          echo

      - name: Upload APKs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saeed-stores-apks
          path: artifacts/
          if-no-files-found: warn
