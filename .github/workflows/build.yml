name: Build and verify

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build, test and package both apps
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the runner Android SDK
        run: |
          set -euo pipefail
          # The runner image already ships a complete Android SDK. Using it
          # avoids downloading anything and keeps the build fast.
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "--- searching for sdkmanager ---"
          SDKMANAGER_PATH="$(find / -name sdkmanager -type f -perm -u+x 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER_PATH" ]; then
            SDK_ROOT="$(dirname "$(dirname "$(dirname "$SDKMANAGER_PATH")")")"
            echo "Found sdkmanager at $SDKMANAGER_PATH"
            echo "Using SDK root $SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          else
            echo "--- no sdkmanager found; listing the usual locations ---"
            ls -la /usr/local/lib/android/sdk 2>&1 || true
            ls -la "$HOME/Android" 2>&1 || true
            {
              echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
              echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
              echo "sdkmanager found at: ${SDKMANAGER_PATH:-none}"
              echo "--- /usr/local/lib/android/sdk ---"
              ls -la /usr/local/lib/android/sdk 2>&1 || true
              echo "--- /opt/android ---"
              ls -la /opt/android 2>&1 || true
              echo "--- home Android ---"
              ls -la "$HOME/Android" 2>&1 || true
              echo "--- all sdkmanager binaries ---"
              find / -name 'sdkmanager*' 2>/dev/null | head -n 20
            } > /tmp/runner-probe.txt 2>&1
            echo "--- downloading the command line tools ---"
            mkdir -p "$HOME/Android/Sdk/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$HOME/Android/Sdk/cmdline-tools/latest"
            echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
            echo "SDKMANAGER=$HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          fi
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept licenses and install the platform
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          # The project compiles against API 37; install the platform and the
          # matching build tools. The list is read from the repository so a
          # newer platform can be used without editing this file.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37" "build-tools;37.0.0"

      # The publishable key and the project URL are public values, but they are
      # kept in secrets so nothing sensitive is ever committed.
      - name: Generate local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties

      # The signing key is created in the runner only and never leaves it.
      - name: Generate a signing keystore for the packaging checks
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass android -keypass android \
            -alias saeed -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Saeed Stores, OU=Dev, O=Saeed, L=Algiers, C=DZ"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=android
          keyAlias=saeed
          keyPassword=android
          EOF

      - name: Run unit tests and lint
        env:
          SAEED_COMPILE_SDK: ${{ vars.SAEED_COMPILE_SDK }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test lint 2>&1 | tee /tmp/gradle-test.log || {
            echo "### Gradle test and lint failure"
            echo '```'
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong|^\s+>' -A 3 /tmp/gradle-test.log | head -n 150
            echo '```'
            exit 1
          }

      - name: Build both release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :customer:assembleRelease :admin:assembleRelease 2>&1 | tee /tmp/gradle-build.log || {
            echo "### Gradle build failure"
            echo '```'
            grep -E 'error:|e: |FAILED|Execution failed|Caused by|\* What went wrong|^\s+>' -A 3 /tmp/gradle-build.log | head -n 180
            echo '```'
            exit 1
          }
          mkdir -p artifacts/apk
          cp customer/build/outputs/apk/release/*.apk artifacts/apk/saeed-store-1.0.apk
          cp admin/build/outputs/apk/release/*.apk artifacts/apk/saeed-admin-1.0.apk

      - name: Verify the packages (acceptance checks 1-10)
        run: |
          bash scripts/verify-apk.sh artifacts/apk/saeed-store-1.0.apk saeed-store
          bash scripts/verify-apk.sh artifacts/apk/saeed-admin-1.0.apk saeed-admin

      - name: Verify the repository (acceptance checks 11-13)
        run: bash scripts/verify-repo.sh

      - name: Run the local database smoke tests
        working-directory: supabase/tests
        run: |
          npm ci --no-audit --no-fund
          npm test


      # The failure output is published with the GitHub API so it can be read
      # even when the log and artifact storage hosts are unreachable.
      - name: Publish diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          {
            echo "# CI diagnostics"
            echo
            echo "Run: $RUN_ID"
            echo "Commit: $SHA"
            echo
            echo "## runner probe"
            echo '```'
            cat /tmp/runner-probe.txt 2>/dev/null || echo "(no probe output)"
            echo '```'
            echo
            echo '## Gradle test and lint'
            echo '```'
            tail -n 200 /tmp/gradle-test.log 2>/dev/null || echo "(not reached)"
            echo '```'
            echo
            echo '## Gradle build'
            echo '```'
            tail -n 200 /tmp/gradle-build.log 2>/dev/null || echo "(not reached)"
            echo '```'
          } > diagnostics/latest.md

          # The payload is built with a JSON encoder so newlines and quotes in
          # the captured output are escaped correctly.
          python3 -c "import base64,json,os; d=open('diagnostics/latest.md','rb').read(); open('/tmp/diag-payload.json','w').write(json.dumps({'message':'CI diagnostics for run '+os.environ['RUN_ID'],'content':base64.b64encode(d).decode('ascii'),'branch':'ci-diagnostics'}))"

          # Point the diagnostics branch at the commit that was just built.
          curl -sS -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/refs/heads/ci-diagnostics" \
            -d "{\"sha\":\"$SHA\",\"force\":true}" > /dev/null

          curl -sS -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/diagnostics/latest.md?branch=ci-diagnostics" \
            --data-binary @/tmp/diag-payload.json \
            -o /tmp/diag-response.json -w 'HTTP %{http_code}\n'
          head -c 300 /tmp/diag-response.json
          echo

      - name: Upload APKs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saeed-stores-apks
          path: artifacts/
          if-no-files-found: warn
