name: Core and schema checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install required SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Validate wrapper and configure Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Compile app shells and test shared module
        run: ./gradlew :core:testDebugUnitTest :core:lintDebug :customer:compileDebugKotlin :admin:compileDebugKotlin --no-daemon
      - name: Check customer runtime does not contain Supabase Auth
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :customer:dependencies --configuration debugRuntimeClasspath --no-daemon > customer-dependencies.txt
          if grep -Eq 'io\.github\.jan-tennert\.supabase:(auth-kt|postgrest-kt)' customer-dependencies.txt; then
            echo 'Unexpected Supabase Auth/PostgREST dependency in customer runtime.' >&2
            exit 1
          fi
          if grep -q ' FAILED' customer-dependencies.txt; then
            echo 'A customer runtime dependency could not be resolved.' >&2
            exit 1
          fi
      - name: Upload shared unit-test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-unit-test-report
          path: core/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  sql-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run PostgreSQL smoke tests
        run: npm ci --no-audit --no-fund && npm test
